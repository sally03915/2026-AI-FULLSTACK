spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XE
    username: boot
    password: react
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update  #  test환경  create-drop 매번초기화 / update 부분수정  
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB      

